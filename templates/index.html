<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixiv 批量下载工具</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Pixiv 批量下载工具</span>
        </div>
    </nav>

    <div class="container mt-4">
        {% if needs_setup %}
        <div id="setup-wizard" class="row g-4">
            <div class="col-lg-5">
                <div class="card h-100 border-primary">
                    <div class="card-body">
                        <span class="badge text-bg-primary mb-3">步骤 1：欢迎</span>
                        <h1 class="card-title">欢迎使用 Pixiv 批量下载工具</h1>
                        <p class="card-text">应用已成功启动。完成 Pixiv Refresh Token 配置后即可开始使用。</p>
                    </div>
                </div>
            </div>
            <div class="col-lg-7">
                <div class="card h-100">
                    <div class="card-body">
                        <span class="badge text-bg-secondary mb-3">步骤 2：Token 配置</span>
                        <h2 class="h4">连接 Pixiv</h2>
                        <p class="text-muted">Token 只会在本机加密保存，不会显示在页面中。</p>
                        <form id="token-form">
                            <label for="refresh-token" class="form-label">Refresh Token</label>
                            <textarea id="refresh-token" class="form-control" rows="3" required autocomplete="off"></textarea>
                            <button id="token-submit" class="btn btn-primary mt-3" type="submit">验证并保存</button>
                        </form>
                        <div id="token-feedback" class="alert mt-3 d-none" role="alert"></div>
                    </div>
                </div>
            </div>
        </div>
        {% else %}
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-body text-center">
                        <h1 class="card-title">欢迎使用 Pixiv 批量下载工具</h1>
                        <p class="card-text text-muted">版本 0.1.0</p>
                        <p class="mt-4 text-success">Pixiv Token 已配置，可以开始使用。</p>
                    </div>
                </div>
            </div>
        </div>
        {% endif %}

        <section id="proxy-settings" class="card mt-4">
            <div class="card-body">
                <h2 class="h4">代理设置</h2>
                <p class="text-muted">配置后，Pixiv API 与图片下载请求都会使用同一代理。</p>
                <form id="proxy-form">
                    <fieldset class="mb-3">
                        <legend class="form-label fs-6">代理类型</legend>
                        <div class="d-flex flex-wrap gap-3">
                            <label><input class="form-check-input" type="radio" name="proxy-type" value="none" checked> 无代理</label>
                            <label><input class="form-check-input" type="radio" name="proxy-type" value="system"> 系统代理</label>
                            <label><input class="form-check-input" type="radio" name="proxy-type" value="http"> HTTP/HTTPS</label>
                            <label><input class="form-check-input" type="radio" name="proxy-type" value="socks5"> SOCKS5</label>
                        </div>
                    </fieldset>
                    <div id="proxy-details" class="row g-3">
                        <div class="col-md-6">
                            <label for="proxy-host" class="form-label">代理地址</label>
                            <input id="proxy-host" class="form-control" autocomplete="off" placeholder="127.0.0.1">
                        </div>
                        <div class="col-md-6">
                            <label for="proxy-port" class="form-label">端口</label>
                            <input id="proxy-port" class="form-control" type="number" min="1" max="65535" placeholder="1080">
                        </div>
                        <div class="col-md-6">
                            <label for="proxy-username" class="form-label">用户名（可选）</label>
                            <input id="proxy-username" class="form-control" autocomplete="off">
                        </div>
                        <div class="col-md-6">
                            <label for="proxy-password" class="form-label">密码（可选）</label>
                            <input id="proxy-password" class="form-control" type="password" autocomplete="new-password">
                        </div>
                    </div>
                    <div class="mt-3 d-flex gap-2">
                        <button id="proxy-save" class="btn btn-primary" type="submit">保存代理</button>
                        <button id="proxy-test" class="btn btn-outline-primary" type="button">测试连接</button>
                    </div>
                </form>
                <div id="proxy-feedback" class="alert mt-3 d-none" role="alert"></div>
            </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
